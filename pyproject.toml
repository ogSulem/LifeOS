[project]
name = "lifeos-bot"
version = "0.1.0"
description = "LifeOS Assistant Telegram bot"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4.1",
  "SQLAlchemy>=2.0.25",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "APScheduler>=3.10.4",
  "alembic>=1.13.1",
  "yookassa>=3.7.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["lifeos_bot*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
